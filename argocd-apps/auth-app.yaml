apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-app
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "3" }
spec:
  project: default
  source: { repoURL: https://github.com/AbaProgramm/k8s-gitops, targetRevision: main, path: apps/auth-app/overlays/prod }
  destination: { server: https://kubernetes.default.svc, namespace: auth-app }
  # Как на работе: manual sync (Refresh + Sync). Для лаба можно включить automated — осознанно.
  syncPolicy: { syncOptions: [SkipDryRunOnMissingResource=true] }
