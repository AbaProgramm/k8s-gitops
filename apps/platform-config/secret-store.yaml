# ESO ходит в твой Vault по Kubernetes auth. В Vault: роль "external-secrets" -> SA external-secrets/external-secrets,
# политика read на secret/data/auth-app/*  (КВ v2 по пути "secret", как у тебя уже настроено)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: vault }
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200     # поправь namespace/имя сервиса своего Vault
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef: { name: external-secrets, namespace: external-secrets }
