# default-deny + точечные разрешения (zero trust внутри кластера)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: auth-app }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: app, namespace: auth-app }
spec:
  podSelector: { matchLabels: { app: auth-app } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } } },
             { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
      ports: [{ port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { cnpg.io/cluster: auth-db } } }]
      ports: [{ port: 5432 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]   # DNS
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: db, namespace: auth-app }
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: auth-db } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: auth-app } } },
             { podSelector: { matchLabels: { cnpg.io/cluster: auth-db } } },
             { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } } },
             { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } } }]
