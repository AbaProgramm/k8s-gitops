apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: auth-app, namespace: auth-app, labels: { release: kube-prometheus-stack } }
spec:
  selector: { matchLabels: { app: auth-app } }
  endpoints: [{ port: http, path: /metrics, interval: 15s }]
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: { name: auth-app, namespace: auth-app, labels: { release: kube-prometheus-stack } }
spec:
  groups:
    - name: auth-app.slo
      rules:
        # SLI: доля не-5xx запросов. SLO 99.5% за 30д -> error budget 0.5%
        - record: auth_app:availability:ratio_rate5m
          expr: 1 - (sum(rate(http_requests_total{namespace="auth-app",status=~"5.."}[5m])) / sum(rate(http_requests_total{namespace="auth-app"}[5m])))
        - alert: AuthAppHighErrorBurn           # multi-window burn rate: быстрый пожар
          expr: |
            (1 - sum(rate(http_requests_total{namespace="auth-app",status!~"5.."}[5m])) / sum(rate(http_requests_total{namespace="auth-app"}[5m]))) > (14.4 * 0.005)
            and
            (1 - sum(rate(http_requests_total{namespace="auth-app",status!~"5.."}[1h])) / sum(rate(http_requests_total{namespace="auth-app"}[1h]))) > (14.4 * 0.005)
          for: 2m
          labels: { severity: page }
          annotations: { summary: "auth-app сжигает error budget в 14x", runbook: "docs/runbooks.md#high-error-rate" }
        - alert: AuthAppLatencyP99
          expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="auth-app"}[5m]))) > 1
          for: 10m
          labels: { severity: ticket }
        - alert: AuthBruteForce
          expr: sum(rate(auth_logins_total{result="bad_credentials"}[5m])) > 2
          for: 5m
          labels: { severity: ticket }
          annotations: { summary: "много неудачных логинов — возможный brute-force" }
        - alert: AuthAppPodsNotReady
          expr: kube_deployment_status_replicas_available{namespace="auth-app",deployment="auth-app"} < 2
          for: 5m
          labels: { severity: page }
