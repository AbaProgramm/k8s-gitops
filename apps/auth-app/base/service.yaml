apiVersion: v1
kind: Service
metadata: { name: auth-app, namespace: auth-app, labels: { app: auth-app } }
spec:
  selector: { app: auth-app }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-app
  namespace: auth-app
  annotations: { cert-manager.io/cluster-issuer: homelab-ca }
spec:
  ingressClassName: traefik
  tls: [{ hosts: [auth.home.lab], secretName: auth-app-tls }]
  rules:
    - host: auth.home.lab
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: auth-app, port: { name: http } } } }] }
