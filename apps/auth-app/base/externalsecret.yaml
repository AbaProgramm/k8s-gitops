# Секрет живёт в Vault (secret/auth-app/jwt -> key "secret"), в Git только ссылка на него.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: { name: auth-app-secrets, namespace: auth-app }
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: ClusterSecretStore, name: vault }
  target: { name: auth-app-secrets }
  data:
    - secretKey: JWT_SECRET
      remoteRef: { key: auth-app/jwt, property: secret }
